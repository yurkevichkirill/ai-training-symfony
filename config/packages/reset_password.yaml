symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository

    # AC-10: a token is refused more than one hour after issue.
    lifetime: 3600

    # The bundle's own per-account throttle is disabled here, not tuned --
    # every limit in this slice is expressed exactly once, in
    # symfony/rate-limiter (config/packages/rate_limiter.yaml's
    # password_reset_account / password_reset_source, consumed by
    # App\Service\PasswordResetService), at the G-22 numbers. Leaving the
    # bundle's own throttle live at a different number would mean two
    # throttles disagreeing with each other -- one G-22 violation waiting to
    # happen, per the architecture's Decisions table.
    throttle_limit: 0
