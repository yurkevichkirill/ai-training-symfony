security:
    # 'auto' resolves to Argon2id here (sodium is loaded), and stays correct if
    # PHP's preferred algorithm moves. Keyed on the interface rather than on
    # App\Entity\User so any future authenticatable class inherits it.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # No `property:` on purpose. Left unset, Doctrine's EntityUserProvider
        # delegates the lookup to UserRepository::loadUserByIdentifier(), which
        # is where email normalization lives. Setting `property: email` would
        # bypass the repository and compare the raw typed identifier against the
        # stored column, so 'Ann@X.com' would fail to match 'ann@x.com' (AC-5).
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Runs after the password is verified, never before -- see the class
            # docblock for why checking account state pre-auth would leak it.
            user_checker: App\Security\AccountStatusChecker

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: _username
                password_parameter: _password
                # The token id is 'authenticate' by default, which is already in
                # csrf.yaml's stateless_token_ids -- nothing to override (AC-21).
                enable_csrf: true
                default_target_path: app_home
                always_use_default_target_path: false
                # Collapses every failure cause to one message and one response
                # shape, so the response cannot be used to enumerate accounts.
                failure_handler: App\Security\UniformAuthenticationFailureHandler

            # Runs before the password is checked (login_throttling fires
            # ahead of the authenticator), at G-22's numbers: 5/15min per
            # account, 20/hour per source IP block. See the class docblock
            # for why it keys on the submitted identifier (AC-19).
            login_throttling:
                limiter: App\Security\LoginRateLimiter

            logout:
                path: app_logout
                target: app_login
                invalidate_session: true
                # token id defaults to 'logout', also in stateless_token_ids.
                enable_csrf: true

    # Flat by design. ROLE_SUPER_ADMIN deliberately does NOT inherit
    # ROLE_TRAINER and friends: inheritance would give a Super Admin silent,
    # unaudited reach into a trainer's workspace. That reach is impersonation,
    # which is S6, and it is logged.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_USER]
        ROLE_TRAINER: [ROLE_USER]
        ROLE_COACH: [ROLE_USER]
        ROLE_PLAYER: [ROLE_USER]

    # Only the *first* matching rule is applied, so the catch-all must stay
    # last. It is a catch-all rather than a list of protected prefixes on
    # purpose: a route added later is protected by default, and forgetting to
    # list it fails closed instead of open (AC-18).
    access_control:
        - { path: ^/(login|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/invitations, roles: PUBLIC_ACCESS }
        # S3 (AC-1, AC-3, AC-14): the two public ShareLink/coach-invitation
        # landing pages -- positioned ahead of the `^/` catch-all, same
        # rule as every other public prefix above. RouterSweepTest
        # (tests/Functional/RouterSweepTest.php) reads this file directly,
        # so these two lines are what extends its allow-list too.
        - { path: ^/join, roles: PUBLIC_ACCESS }
        - { path: ^/coach-invitation, roles: PUBLIC_ACCESS }
        - { path: ^/(css|js|images)/, roles: PUBLIC_ACCESS }
        - { path: ^/favicon.ico, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
