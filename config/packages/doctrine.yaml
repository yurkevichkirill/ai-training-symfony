doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # symfony/uid ships the DBAL types but nothing registers them: neither
        # DoctrineBundle nor the symfony/uid Flex recipe adds them, and
        # Type::hasType('uuid') is false without this block. Entities use
        # UuidType::NAME for their UUIDv7 primary keys.
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
            # PostgreSQL's native inet, for auth_event.ip. DBAL ships no
            # first-class type for it; see App\Doctrine\Type\InetType.
            inet: App\Doctrine\Type\InetType

        # Without this, schema introspection reads an `inet` column back as an
        # unknown DB type and doctrine:schema:validate reports permanent drift
        # ("ALTER TABLE auth_event ALTER ip TYPE INET") against a schema that is
        # in fact correct.
        mapping_types:
            inet: inet
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
