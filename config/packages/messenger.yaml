framework:
    messenger:
        # Task 2's note: `%env(MESSENGER_TRANSPORT_DSN)%` already carries
        # `auto_setup=0` in `.env` (the Flex default), so the
        # `messenger_messages` table must come from a migration -- see the
        # `messenger_messages` migration this task adds. `failed` reuses the
        # same `default` DBAL connection/table with a distinct `queue_name`
        # rather than a second physical table (the standard pattern; DBAL
        # models no schema for it beyond the one `messenger_messages` table).
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Deliberately NOT set here (nor under when@test below).
            #
            # `App\Message\SendEmailMessage` is routed to `async` only under
            # `when@dev:`/`when@prod:`. Once a message class has ANY routing
            # entry, Messenger's SendMessageMiddleware sends it to that
            # transport and does NOT also invoke local handlers in the same
            # process (that is the whole point of routing -- a transport
            # substitutes for local handling, it does not add to it). Task
            # 28's `tests/Support/RecordingEmailMessageHandler` needs the
            # opposite: `EmailVerificationService::resend()`'s dispatch
            # handled synchronously, in-process, with no transport in
            # between, so its test can call `->last()` immediately after
            # `resend()` returns with no worker involved. Giving
            # `SendEmailMessage` a routing entry in test (or at this
            # unconditional base level, which test would inherit) would
            # silently break every already-green Task 28 assertion. So: no
            # routing entry at all here or in test -> the message stays on
            # the default bus and is handled locally by whatever handler is
            # tagged in that environment (`RecordingEmailMessageHandler`,
            # test-only, see config/services.yaml); a routing entry under
            # when@dev/when@prod only -> those environments' real
            # `App\MessageHandler\SendEmailMessageHandler` (also not tagged
            # in test -- see the same services.yaml note) receives it via the
            # `async` transport instead. Confirmed empirically with
            # `debug:messenger` in all three environments -- see Task 29's
            # plan note.

when@dev:
    framework:
        messenger:
            routing:
                'App\Message\SendEmailMessage': async

when@prod:
    framework:
        messenger:
            routing:
                'App\Message\SendEmailMessage': async
