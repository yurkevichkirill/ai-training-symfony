services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/app:cached
    working_dir: /app

  nginx:
    image: nginx:1.30-alpine
    depends_on:
      - php
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./:/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro